name: Build Bharat Trade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          unzip -q bharat_trade_android_build_ready.zip -d buildsrc
          cd buildsrc/bharat_trade_android_build_ready
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Trade-AI-APK
          path: "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
