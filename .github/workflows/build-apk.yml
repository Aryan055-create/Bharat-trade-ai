name: Build Bharat Trade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Android project
        run: |
          echo "Preparing Android project..."

          mkdir -p app/src/main/java/com/bharattrade
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/com/bharattrade/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BharatTrade"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bharattrade'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bharattrade'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          echo "Project prepared:"
          find app -type f

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Trade-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
